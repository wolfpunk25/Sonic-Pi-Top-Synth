# Added for the Sonic Pi station: BLE MIDI controllers.
# /usr/lib/systemd/system/bluetooth.service.d/10-experimental-mode.conf
# (left behind by pi-top Further Link, now disabled) only allows the gatt and
# hostname plugins, so BlueZ connected to BLE MIDI devices but never made an
# ALSA MIDI port for them. Same command line, plus the midi plugin.
# Remove this file (then daemon-reload and restart bluetooth) to undo.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --experimental --plugin=gatt,hostname,midi --noplugin=deviceinfo,advertisement,audio
