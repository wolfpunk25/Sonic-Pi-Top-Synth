; Copied to ~/.config/pitop-weather.ini on the Pi. Edit that copy, then:
;   systemctl --user restart pitop-weather

[place]
; A town name is looked up once and remembered.
name = Lincoln
; Two-letter country code, so "Newport" finds the right one.
country = GB
; Or skip the lookup by giving coordinates (leave blank to use the name):
latitude =
longitude =

[behaviour]
refresh_minutes = 10
; Dim to a small wandering clock after this long without a button press
; (OLEDs burn in if one picture sits there for hours).
screensaver_seconds = 120
; Page shown at start: now, next, rain, wind, sun, pressure, tomorrow, device
start_page = now
; Speak a warning when rain is due within this many minutes.
rain_alert_minutes = 30
; Speak a warning as the battery falls through each of these levels.
battery_warnings = 20, 10
; Alerts still show on screen during these hours, but stay silent.
quiet_from = 22:00
quiet_until = 08:00

[voice]
; espeak-ng voice: en-gb, en-gb-scotland, en-gb-x-rp, en-us ...
voice = en-gb
speed = 150
volume = 100
; Where the voice plays: speaker (the pi-top's own), usb, or default.
output = speaker

[recorder]
; Clips go in dated folders here, each WAV with a .json label beside it.
folder = ~/soundwalks
; Longest clip; Select stops sooner.
seconds = 60
; ALSA device; "default" goes through PipeWire, which picks up a USB mic.
device = default
sample_rate = 48000
; Say "Saved, N seconds" after each clip (never during one).
announce = yes

[sonicpi]
; Sonic Pi 5, unpacked from its AppImage (runs in the Debian 13 chroot).
app_dir = ~/apps/sonic-pi-5.0.0
; Your sketches: every .rb here is one entry in the list, in filename order.
; The first comment line is its title ("# Keys - Prophet synth").
; Starter sketches are copied in when the folder is empty.
sketches = ~/sonicpi-sketches
; Audio buffer in samples: 128 is ~2.7 ms; raise it if you hear crackles.
buffer_size = 128
; Where Sonic Pi plays to start with: usb, speaker or default.
output = usb
